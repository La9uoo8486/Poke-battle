name: 사용률 갱신
on:
  schedule:
    - cron: '0 3 * * 1'   # 매주 월요일 12:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-usage.mjs
      - name: 변경 시 커밋
        run: |
          if git diff --quiet data/usage.json; then echo "변경 없음"; exit 0; fi
          git config user.name "usage-bot"
          git config user.email "usage-bot@users.noreply.github.com"
          git add data/usage.json
          git commit -m "사용률 데이터 갱신"
          git push
